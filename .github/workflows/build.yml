name: Build Android APK

# Savage Wind Recomp - Android port. Everything is compiled here in the cloud (never locally):
# the native dependencies (SDL3, FFmpeg, shaderc), the on-device compiler package (clang + lld)
# and the app itself, producing an arm64-v8a APK.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018

    steps:
      - name: Checkout (with submodules, if any)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy's buildPython: pip resolution for the on-device generator's packages
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Android SDK / NDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache native dependency build
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/cpp/deps
            app/src/main/jniLibs/arm64-v8a
            app/src/main/assets/clang-include
          key: swc-android-deps-${{ hashFiles('scripts/build_deps_android.sh') }}

      - name: Build native dependencies (SDL3, FFmpeg, shaderc, clang/lld package)
        run: |
          bash scripts/build_deps_android.sh

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false  # the wrapper jar comes from the official gradle/gradle tag

      - name: Assemble release APK
        env:
          # Optional release signing: set these repository secrets to sign with your own key.
          # Without them the APK is signed with the debug keystore (fine for sideloading).
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavageWind-android-arm64
          path: dist/*.apk
          if-no-files-found: error

      - name: Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
