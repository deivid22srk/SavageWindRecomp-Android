plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.deivid22srk.savagewind'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.deivid22srk.savagewind'
        // 28: posix_spawn (the compiler / generator children), like the desktop flow
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.2.0-alpha.2-android.1'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          '-DCMAKE_BUILD_TYPE=Release'
                cppFlags '-O2 -g -fno-strict-aliasing'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packagingOptions {
        // real files on disk: libtcc needs libmain.so's path, and tcc's runtime helpers ship as assets
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // CI secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) sign the
            // release APK; without them it falls back to the debug keystore (fine for testing).
            if (System.getenv('KEYSTORE_BASE64')) {
                signingConfig signingConfigs.ci
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    signingConfigs {
        if (System.getenv('KEYSTORE_BASE64')) {
            ci {
                storeFile rootProject.file('release.keystore')
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version '3.13'
        pip {
            install 'lz4==4.3.3'   // the Chaquopy repository's lz4 for cp313 / android_24
        }
    }
}
